name: Reporte Diario Oro y Plata

on:
  schedule:
    - cron: '0 14 * * *'   # 08:00 Ciudad de México (UTC-6)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  enviar-reporte:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install requests matplotlib

      - name: Ejecutar el bot
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          DESTINATARIO: ${{ secrets.DESTINATARIO }}
        run: python gold_bot.py

      - name: Guardar historial en el repositorio
        run: |
          git config user.name "bot-oro"
          git config user.email "bot-oro@users.noreply.github.com"
          git add historial.csv
          git commit -m "Actualiza historial" || echo "Sin cambios nuevos que guardar"
          git push
